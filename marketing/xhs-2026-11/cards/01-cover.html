<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="card.css" />
    <style>
      /* 首图：一张对比图。左边官方"续不上"（画的示意），右边 DS Echo"接上了"（真机截图）。
         右上真机屏用的是 Assets 里的实际截图，所以"这是我的 App"这件事一眼就能看出来。 */
      .page {
        padding: 66px 78px 100px;
      }

      /* 应用标识：图标 + 名字，让人第一眼知道"就是它" */
      .brand {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .icon {
        width: 150px;
        height: 150px;
        border-radius: 36px;
        background: #fff;
        border: 4px solid var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
        overflow: hidden;
      }
      .icon img {
        width: 84%;
        height: 84%;
        object-fit: contain;
        image-rendering: auto;
      }
      .brand .n {
        font-size: 54px;
        font-weight: 900;
        letter-spacing: -0.01em;
        line-height: 1.12;
      }
      .brand .d {
        margin-top: 6px;
        font-size: 27px;
        color: var(--ink-3);
        letter-spacing: 0.02em;
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }

      h1 {
        margin-top: 34px;
        font-size: 94px;
        line-height: 1.14;
        font-weight: 900;
        letter-spacing: -0.02em;
      }
      h1 em {
        font-style: normal;
        color: var(--hot);
      }

      .sub {
        margin-top: 20px;
        font-size: 36px;
        font-weight: 500;
        color: var(--ink-2);
      }

      .pair {
        margin-top: 40px;
        display: flex;
        align-items: stretch;
        gap: 18px;
      }

      .col {
        width: 500px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .phone {
        width: 100%;
        height: 768px;
        border-radius: 44px;
        position: relative;
      }

      /* 左：官方，暗 + 灰。整体压暗，让人一眼看出"走不通" */
      .official {
        background: #23232a;
        border: 3px solid #33333c;
        color: #d8d5cf;
        padding: 32px 28px;
        display: flex;
        flex-direction: column;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 25px;
        color: #8d8a83;
        margin-bottom: 26px;
      }
      .card-warn {
        border-radius: 28px;
        background: #2c2c34;
        border: 2px solid #3d3d47;
        padding: 30px 26px;
      }
      .card-warn .t {
        font-size: 36px;
        font-weight: 800;
        line-height: 1.34;
        color: #efede8;
      }
      .card-warn .d {
        margin-top: 16px;
        font-size: 28px;
        line-height: 1.5;
        color: #9b978f;
      }
      .card-warn .btn {
        margin-top: 28px;
        height: 80px;
        border-radius: 18px;
        background: #3a3a44;
        color: #a8a49c;
        font-size: 30px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .official .stamp {
        margin-top: auto;
        color: #8d8a83;
        font-size: 25px;
      }
      /* 两条"虚线气泡"：暗示那些还在、但已经点不开的对话 */
      .ghost {
        margin-top: 26px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .ghost i {
        display: block;
        height: 44px;
        border-radius: 12px;
        border: 2px dashed #3d3d47;
        opacity: 0.55;
      }
      .ghost i:nth-child(1) {
        width: 78%;
      }
      .ghost i:nth-child(2) {
        width: 56%;
        align-self: flex-end;
      }

      /* 右：真机截图。不加任何滤镜，越"原封不动"越可信 */
      .real {
        border: 3px solid var(--ink);
        overflow: hidden;
        background: #fff;
        box-shadow: 0 16px 0 rgba(31, 107, 87, 0.16);
      }
      .real img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: bottom center;
        display: block;
      }
      .real .tag {
        position: absolute;
        left: 50%;
        transform: translateX(-50%) rotate(-2deg);
        bottom: -22px;
        background: var(--ok);
        color: #fff;
        font-size: 24px;
        font-weight: 800;
        padding: 10px 22px;
        border-radius: 999px;
        white-space: nowrap;
      }

      .verdict {
        font-size: 38px;
        font-weight: 900;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .verdict.no {
        color: #9a938a;
      }
      .verdict.yes {
        color: var(--ok);
      }
      .mark {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        color: #fff;
      }
      .no .mark {
        background: #9a938a;
      }
      .yes .mark {
        background: var(--ok);
      }
      .mid {
        width: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: 900;
        color: var(--ink-3);
      }

      .bottom {
        margin-top: auto;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }
      .bottom .txt {
        font-size: 29px;
        color: var(--ink-2);
        line-height: 1.45;
      }
      .bottom .txt b {
        color: var(--ink);
      }
      .disclaim {
        position: absolute;
        left: 78px;
        bottom: 24px;
        font-size: 22px;
        color: #b9b3a8;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="top">
        <div class="brand">
          <span class="icon"><img src="assets/app-icon-round.png" alt="DS Echo" /></span>
          <span>
            <div class="n">DS Echo</div>
            <div class="d">安卓 · 开源 · 全本地</div>
          </span>
        </div>
        <span class="note">我自己写的</span>
      </div>

      <h1>7 天前的长对话<br /><em>我给它接回来了</em></h1>
      <p class="sub">官方导出的 ZIP 丢进去，原样接着聊</p>

      <div class="pair">
        <div class="col">
          <div class="phone official">
            <div class="bar"><span>DeepSeek 官方 App</span><span>×</span></div>
            <div class="card-warn">
              <div class="t">该对话已超过<br />7 天未活跃</div>
              <div class="d">系统不再支持继续此对话，建议开启新对话。</div>
              <div class="btn">发起新对话</div>
            </div>
            <div class="ghost"><i></i><i></i></div>
            <div class="stamp">前面几百轮设定，全没了</div>
          </div>
          <div class="verdict no"><span class="mark">×</span>续不上</div>
        </div>

        <div class="mid">VS</div>

        <div class="col">
          <div class="phone real">
            <img src="assets/app-screen.png" alt="DS Echo 真机界面" />
          </div>
          <div class="verdict yes"><span class="mark">✓</span>接上了</div>
        </div>
      </div>

      <div class="bottom">
        <div class="txt">
          <b>不覆盖原有记录</b> · 导入前可预览<br />
          走你自己的 API Key，没有 7 天过期
        </div>
        <span class="note" style="transform: rotate(2deg); font-size: 29px">往下看 3 步教程 →</span>
      </div>

      <span class="disclaim">左为官方限制示意 · 右为真机截图</span>
    </div>
  </body>
</html>
