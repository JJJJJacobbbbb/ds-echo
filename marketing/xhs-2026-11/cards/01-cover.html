<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="card.css" />
    <style>
      /* 首图：一张对比图。左边官方"续不上"，右边 DS Echo"接上了"。
         目标是缩成缩略图也能看懂，所以文字极少、色块对比极大。 */
      .page {
        padding: 74px 78px 104px;
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      h1 {
        margin-top: 46px;
        font-size: 104px;
        line-height: 1.14;
        font-weight: 900;
        letter-spacing: -0.02em;
      }
      h1 em {
        font-style: normal;
        color: var(--hot);
      }

      .sub {
        margin-top: 26px;
        font-size: 38px;
        font-weight: 500;
        color: var(--ink-2);
      }

      .pair {
        margin-top: 54px;
        display: flex;
        align-items: stretch;
        gap: 20px;
      }

      .col {
        width: 528px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }

      .phone {
        width: 100%;
        height: 762px;
        border-radius: 42px;
        padding: 34px 30px;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      /* 左：官方，暗 + 灰 + 红。整体压暗，让人一眼看出"走不通" */
      .official {
        background: #23232a;
        border: 3px solid #33333c;
        color: #d8d5cf;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 26px;
        color: #8d8a83;
        margin-bottom: 30px;
      }
      .official .card-warn {
        margin-top: 20px;
        border-radius: 28px;
        background: #2c2c34;
        border: 2px solid #3d3d47;
        padding: 34px 28px;
      }
      .official .t {
        font-size: 38px;
        font-weight: 800;
        line-height: 1.35;
        color: #efede8;
      }
      .official .d {
        margin-top: 18px;
        font-size: 30px;
        line-height: 1.5;
        color: #9b978f;
      }
      .official .btn {
        margin-top: 32px;
        height: 84px;
        border-radius: 20px;
        background: #3a3a44;
        color: #a8a49c;
        font-size: 32px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .official .stamp {
        margin-top: auto;
        color: #8d8a83;
        font-size: 26px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* 右：DS Echo，亮 + 绿。一眼是"活的" */
      .echo {
        background: var(--paper-2);
        border: 3px solid var(--ok);
        box-shadow: 0 18px 0 rgba(31, 107, 87, 0.14);
      }
      .echo .bar {
        color: var(--ink-3);
      }
      .echo .ok-tag {
        align-self: flex-start;
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--ok-soft);
        color: var(--ok);
        font-size: 28px;
        font-weight: 800;
        padding: 12px 22px;
        border-radius: 999px;
      }
      .bub {
        margin-top: 22px;
        padding: 24px 26px;
        font-size: 31px;
        line-height: 1.5;
        border-radius: 24px;
      }
      .bub.me {
        align-self: flex-end;
        background: #e9e4d8;
        max-width: 92%;
      }
      .bub.ai {
        background: #fff;
        border: 2px solid var(--line);
        max-width: 96%;
      }
      .typing {
        margin-top: 14px;
        display: flex;
        gap: 9px;
      }
      .typing i {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--ok);
        opacity: 0.55;
      }
      .echo .input {
        margin-top: auto;
        height: 92px;
        border-radius: 46px;
        border: 2px solid var(--line);
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px 0 30px;
        font-size: 30px;
        color: var(--ink-3);
      }
      .echo .send {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        background: var(--ok);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        font-weight: 800;
      }

      .verdict {
        font-size: 40px;
        font-weight: 900;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .verdict.no {
        color: #9a938a;
      }
      .verdict.yes {
        color: var(--ok);
      }
      .mark {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        color: #fff;
      }
      .no .mark {
        background: #9a938a;
      }
      .yes .mark {
        background: var(--ok);
      }

      .mid {
        width: 86px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        font-weight: 900;
        color: var(--ink-3);
      }

      .bottom {
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .bottom .txt {
        font-size: 30px;
        color: var(--ink-2);
        line-height: 1.4;
      }
      .bottom .txt b {
        color: var(--ink);
      }

      /* 两张手机屏都是画的示意图，不是真实截图，所以标一句实话 */
      .disclaim {
        position: absolute;
        left: 78px;
        bottom: 24px;
        font-size: 22px;
        color: #b9b3a8;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="top">
        <span class="chip">安卓 · 开源 · 全本地</span>
        <span class="note">我自己写的</span>
      </div>

      <h1>7 天前的长对话<br /><em>我给它接回来了</em></h1>
      <p class="sub">官方导出的 ZIP 丢进去，原样接着聊</p>

      <div class="pair">
        <div class="col">
          <div class="phone official">
            <div class="bar"><span>DeepSeek 官方 App</span><span>×</span></div>
            <div class="card-warn">
              <div class="t">该对话已超过<br />7 天未活跃</div>
              <div class="d">系统不再支持继续此对话，建议开启新对话。</div>
              <div class="btn">发起新对话</div>
            </div>
            <div class="stamp">前面几百轮设定，全没了</div>
          </div>
          <div class="verdict no"><span class="mark">×</span>续不上</div>
        </div>

        <div class="mid">VS</div>

        <div class="col">
          <div class="phone echo">
            <div class="bar"><span>DS Echo</span><span>···</span></div>
            <div class="ok-tag">✓ 已导入 1 个会话</div>
            <div class="bub me">接着上次的世界观，我回来了</div>
            <div class="bub ai">记得。你设定的那位，还在雨里等第三封信。</div>
            <div class="typing"><i></i><i></i><i></i></div>
            <div class="input"><span>请输入消息</span><span class="send">↑</span></div>
          </div>
          <div class="verdict yes"><span class="mark">✓</span>接上了</div>
        </div>
      </div>

      <div class="bottom">
        <div class="txt">
          <b>不覆盖原有记录</b> · 导入前可预览<br />
          走你自己的 API Key，没有 7 天过期
        </div>
        <span class="note" style="transform: rotate(2deg); font-size: 30px">往下看 3 步教程 →</span>
      </div>

      <span class="disclaim">左为官方限制示意 · 右为界面示意</span>
    </div>
  </body>
</html>
