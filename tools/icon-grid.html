<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>DS Echo 图标工作台 · 图案</title>
<!--
  用途：在铺满整块画布的三种图案里点选色块，作为应用图标的主图形。
  三种图案：
    1) 等边三角形（上下交替铺满）
    2) 条形地砖（横排/竖排成「回」字形交替，即 basketweave）
    3) 等腰直角三角形（方格对角切分，斜线方向交替）
  为什么单文件、零依赖：这是做设计决定用的临时工具，双击就能开，不需要构建或服务器。
  输出：图案名 + 归一化坐标，交给 scripts/generate-icons.py 渲染成 Android 资源。
-->
<style>
  :root {
    --blue: #3d7cff;
    --ink: #1c2128;
    --muted: #6b7280;
    --line: #e2e7ef;
    --bg: #f4f6fa;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: var(--bg);
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: #fff;
  }
  h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  .tabs { display: flex; gap: 4px; padding: 3px; background: var(--bg); border-radius: 10px; }
  .tabs button {
    border: none; background: transparent; padding: 6px 12px;
    border-radius: 8px; font: inherit; color: var(--muted); cursor: pointer;
  }
  .tabs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .tools { display: flex; gap: 8px; margin-left: auto; align-items: center; flex-wrap: wrap; }
  button.act {
    font: inherit; padding: 6px 12px; border-radius: 9px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer;
  }
  button.act:hover { border-color: #b9c3d4; }
  button.act.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .zoom { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .zoom input { width: 110px; accent-color: var(--blue); }
  main { flex: 1; min-height: 0; overflow: auto; background: #fff; }
  /* 画布铺满可用区域；图案按实际像素生成，边缘自然裁切 */
  #stage { display: block; cursor: pointer; }
  .cell { fill: transparent; stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .cell.on { fill: var(--blue); stroke: var(--blue); }
  .cell:hover { stroke: var(--blue); stroke-width: 2; }
  #sentinel { height: 1px; }
  footer {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 16px; border-top: 1px solid var(--line);
    background: #fff; font-size: 12px; color: var(--muted);
  }
  footer textarea {
    flex: 1; height: 26px; resize: none; font: 12px ui-monospace, Consolas, monospace;
    border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; color: var(--ink);
    background: #fbfcfe;
  }
</style>
</head>
<body>
<header>
  <h1>DS Echo 图标工作台</h1>
  <div class="tabs" id="tabs">
    <button data-pattern="triangles" class="on">等边三角形</button>
    <button data-pattern="bricks">条形地砖</button>
    <button data-pattern="rightTriangles">等腰直角三角形</button>
  </div>
  <div class="tools">
    <label class="zoom">缩放
      <input id="zoom" type="range" min="1" max="3" step="0.1" value="1" />
      <span id="zoomOut">1.0×</span>
    </label>
    <button class="act" id="clear">清空</button>
    <button class="act" id="random">随机</button>
    <button class="act" id="png">下载 PNG</button>
    <button class="act primary" id="copy">复制选择</button>
  </div>
</header>

<main id="wrap">
  <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
</main>

<footer>
  <span id="count">已选 0 格</span>
  <textarea id="out" readonly spellcheck="false" placeholder="点格子后这里会出现结果，点「复制选择」可复制"></textarea>
</footer>

<script>
(() => {
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const stage = document.getElementById('stage');
  const wrap = document.getElementById('wrap');
  const outEl = document.getElementById('out');
  const countEl = document.getElementById('count');

  const chosen = new Set();
  let pattern = 'triangles';
  let cells = [];        // [{ key, pts: [[x,y],...] }]
  let size = { w: 1, h: 1 };

  /** 把 key 拆成 [col,row,sub]，便于导出后复原 */
  const keyOf = (...parts) => parts.join(':');

  // ---------- 三种图案的生成：都按实际像素铺满整块画布 ----------
  const patterns = {
    /** 等边三角形：上下交替，铺满 */
    triangles(w, h) {
      const side = 76;
      const rows = Math.ceil(h / (side * Math.sqrt(3) / 2)) + 1;
      const cols = Math.ceil(w / side) + 2;
      const hh = side * Math.sqrt(3) / 2;
      const list = [];
      for (let r = 0; r < rows; r++) {
        const yt = r * hh, yb = yt + hh;
        for (let c = -1; c < cols; c++) {
          const x = c * side;
          list.push({ key: keyOf('t', c, r, 'up'), pts: [[x, yb], [x + side, yb], [x + side / 2, yt]] });
          list.push({ key: keyOf('t', c, r, 'down'), pts: [[x + side / 2, yt], [x + side * 1.5, yt], [x + side, yb]] });
        }
      }
      return list;
    },

    /** 条形地砖：横排块与竖排块按棋盘交错（basketweave / 回字形） */
    bricks(w, h) {
      const block = 152;             // 每个方块区域的大小
      const half = block / 2;
      const rows = Math.ceil(h / block) + 1;
      const cols = Math.ceil(w / block) + 1;
      const list = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = c * block, y = r * block;
          if ((r + c) % 2 === 0) {
            // 横排：上下两条长砖
            list.push({ key: keyOf('b', c, r, 0), pts: [[x, y], [x + block, y], [x + block, y + half], [x, y + half]] });
            list.push({ key: keyOf('b', c, r, 1), pts: [[x, y + half], [x + block, y + half], [x + block, y + block], [x, y + block]] });
          } else {
            // 竖排：左右两条长砖
            list.push({ key: keyOf('b', c, r, 0), pts: [[x, y], [x + half, y], [x + half, y + block], [x, y + block]] });
            list.push({ key: keyOf('b', c, r, 1), pts: [[x + half, y], [x + block, y], [x + block, y + block], [x + half, y + block]] });
          }
        }
      }
      return list;
    },

    /** 等腰直角三角形：方格对角切成两半，斜线方向按棋盘交替 */
    rightTriangles(w, h) {
      const s = 84;
      const rows = Math.ceil(h / s) + 1;
      const cols = Math.ceil(w / s) + 1;
      const list = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = c * s, y = r * s;
          // 斜线方向交替：形成「人」字形节奏，不是单纯斜条纹
          if ((r + c) % 2 === 0) {
            list.push({ key: keyOf('r', c, r, 'a'), pts: [[x, y], [x, y + s], [x + s, y + s]] });
            list.push({ key: keyOf('r', c, r, 'b'), pts: [[x, y], [x + s, y], [x + s, y + s]] });
          } else {
            list.push({ key: keyOf('r', c, r, 'a'), pts: [[x, y], [x + s, y], [x, y + s]] });
            list.push({ key: keyOf('r', c, r, 'b'), pts: [[x + s, y], [x + s, y + s], [x, y + s]] });
          }
        }
      }
      return list;
    },
  };

  function build() {
    const zoom = Number(document.getElementById('zoom').value) || 1;
    // 缩放靠放大画布实现，超出部分可滚动
    const w = Math.max(320, Math.round(wrap.clientWidth * zoom));
    const h = Math.max(320, Math.round(wrap.clientHeight * zoom));
    size = { w, h };
    stage.setAttribute('viewBox', `0 0 ${w} ${h}`);
    stage.setAttribute('width', w);
    stage.setAttribute('height', h);
    cells = patterns[pattern](w, h);
    render();
  }

  function render() {
    const frag = document.createDocumentFragment();
    for (const { key, pts } of cells) {
      const poly = document.createElementNS(SVG_NS, 'polygon');
      poly.setAttribute('points', pts.map(([x, y]) => `${x},${y}`).join(' '));
      poly.setAttribute('class', 'cell' + (chosen.has(key) ? ' on' : ''));
      poly.addEventListener('click', () => {
        chosen.has(key) ? chosen.delete(key) : chosen.add(key);
        poly.setAttribute('class', 'cell' + (chosen.has(key) ? ' on' : ''));
        sync();
      });
      frag.appendChild(poly);
    }
    stage.replaceChildren(frag);
    sync();
  }

  /** 归一化到 0~1 的坐标，方便在任何尺寸（尤其是图标 108dp）上复原 */
  function normalizedSelection() {
    return cells
      .filter((c) => chosen.has(c.key))
      .map((c) => ({
        k: c.key,
        p: c.pts.map(([x, y]) => [Number((x / size.w).toFixed(4)), Number((y / size.h).toFixed(4))]),
      }));
  }

  function sync() {
    countEl.textContent = `已选 ${chosen.size} 格`;
    outEl.value = JSON.stringify({ pattern, cells: normalizedSelection() });
  }

  // ---------- 工具栏 ----------
  document.getElementById('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-pattern]');
    if (!btn) return;
    for (const b of e.currentTarget.querySelectorAll('button')) b.classList.toggle('on', b === btn);
    pattern = btn.dataset.pattern;
    chosen.clear();
    build();
  });

  document.getElementById('clear').onclick = () => { chosen.clear(); render(); };

  document.getElementById('random').onclick = () => {
    chosen.clear();
    for (const c of cells) if (Math.random() < 0.3) chosen.add(c.key);
    render();
  };

  document.getElementById('copy').onclick = async () => {
    sync();
    const btn = document.getElementById('copy');
    try {
      await navigator.clipboard.writeText(outEl.value);
      btn.textContent = '已复制';
    } catch {
      outEl.select(); document.execCommand('copy'); btn.textContent = '已复制';
    }
    setTimeout(() => (btn.textContent = '复制选择'), 1200);
  };

  /** 导出 PNG：取画布中心的方形区域（图标是正方形的），108dp * 4 倍 */
  document.getElementById('png').onclick = () => {
    const side = Math.min(size.w, size.h);
    const ox = (size.w - side) / 2, oy = (size.h - side) / 2;
    const polys = cells
      .filter((c) => chosen.has(c.key))
      .map((c) => `<polygon points="${c.pts.map(([x, y]) => `${x},${y}`).join(' ')}" fill="#3d7cff"/>`)
      .join('');
    const svg = `<svg xmlns="${SVG_NS}" viewBox="${ox} ${oy} ${side} ${side}" width="432" height="432">${polys}</svg>`;
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = cv.height = 432;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, 432, 432);
      ctx.drawImage(img, 0, 0, 432, 432);
      const a = document.createElement('a');
      a.href = cv.toDataURL('image/png');
      a.download = `dsecho-${pattern}.png`;
      a.click();
    };
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
  };

  document.getElementById('zoom').oninput = (e) => {
    document.getElementById('zoomOut').textContent = `${Number(e.target.value).toFixed(1)}×`;
    build();
  };

  let timer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(timer);
    timer = setTimeout(build, 150);
  });

  build();
})();
</script>
</body>
</html>
